<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: Live aircraft: Aircraft worldwide from ADS-B: tap one for type, registration, route and live instruments.; Airports: Runways and terminals, the runway in use, a live board, car parks, stations and directions.; Your flights: Save a flight and follow it in widgets, Live Activities and on Apple Watch, with a take-off alert.; Weather on every map: Wind, rain, clouds, storms, icing, jet stream and turbulence, plus METAR, SIGMET and PIREP.; For pilots: Flight plan with a nav log, winds aloft, terrain profile and a moving map with GPS instruments.; Drone mode: Estimated zones, surface wind, Kp index and alerts for manned aircraft nearby."><title>Features: Live aircraft: Aircraft worldwide from ADS-B: tap one for type, registration, route and live instruments.; Airports: Runways and terminals, the runway in use, a live board, car parks, stations and directions.; Your flights: Save a flight and follow it in widgets, Live Activities and on Apple Watch, with a take-off alert.; Weather on every map: Wind, rain, clouds, storms, icing, jet stream and turbulence, plus METAR, SIGMET and PIREP.; For pilots: Flight plan with a nav log, winds aloft, terrain profile and a moving map with GPS instruments.; Drone mode: Estimated zones, surface wind, Kp index and alerts for manned aircraft nearby.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#0969da;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#afb8c1;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="0.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M2 13l8-2V5a2 2 0 0 1 4 0v6l8 2v2l-8-1v4l2 2v1l-4-1-4 1v-1l2-2v-4l-8 1z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Live aircraft</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#59636e">Aircraft worldwide from ADS-B: tap one for type,</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#59636e">registration, route and live instruments.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="0.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Airports</text><text x="572.0" y="66" class="sans" font-size="13.5" fill="#59636e">Runways and terminals, the runway in use, a live</text><text x="572.0" y="85" class="sans" font-size="13.5" fill="#59636e">board, car parks, stations and directions.</text></g><g><rect x="0.5" y="128.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="128.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:3.20s"/><rect x="24.0" y="152" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="152" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:3.20s"/><g transform="translate(32.0 160)"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="170" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Your flights</text><text x="84.0" y="194" class="sans" font-size="13.5" fill="#59636e">Save a flight and follow it in widgets, Live</text><text x="84.0" y="213" class="sans" font-size="13.5" fill="#59636e">Activities and on Apple Watch, with a take-off</text><text x="84.0" y="232" class="sans" font-size="13.5" fill="#59636e">alert.</text></g><g><rect x="488.5" y="128.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="128.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:4.80s"/><rect x="512.0" y="152" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="152" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 160)"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="170" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Weather on every map</text><text x="572.0" y="194" class="sans" font-size="13.5" fill="#59636e">Wind, rain, clouds, storms, icing, jet stream and</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#59636e">turbulence, plus METAR, SIGMET and PIREP.</text></g><g><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 307)"><path d="M6 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 17V9a4 4 0 0 1 4-4h6M18 7v8a4 4 0 0 1-4 4H8" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">For pilots</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#59636e">Flight plan with a nav log, winds aloft, terrain</text><text x="84.0" y="360" class="sans" font-size="13.5" fill="#59636e">profile and a moving map with GPS instruments.</text></g><g><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 307)"><path d="M8 8l8 8M16 8l-8 8M5 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM5 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Drone mode</text><text x="572.0" y="341" class="sans" font-size="13.5" fill="#59636e">Estimated zones, surface wind, Kp index and alerts</text><text x="572.0" y="360" class="sans" font-size="13.5" fill="#59636e">for manned aircraft nearby.</text></g></svg>
